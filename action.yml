name: 'Manifest PR handler'
description: 'Handles manifest PR related tasks'
inputs:
  target-repo:
    required: false
    type: string
    default: nrfconnect/sdk-nrf
    description: 'target repository for manifest PR'
  base-branch:
    required: false
    type: string
    default: main
    description: 'base/target branch for manifest PR'
  forked-repo:
    required: false
    type: string
    default: nordicbuilder/sdk-nrf
    description: 'forked repository where changes are pushed'
  skip-string:
    required: false
    type: string
    default: manifest-pr-skip
  manifest-pr-title-details:
    required: false
    type: string
    default: 'Update revision'
    description: 'Input to the manifest PR title: "manifest: <repo>: <manifest-pr-title-details>"'
  token:
    required: true
    type: string
  draft-pr:
    required: false
    type: boolean
    default: false
    description: 'If set, the manifest PR will be created as a draft PR'
  manifest-file-path:
    required: false
    type: string
    default: west.yml
    description: 'Comma separated list of paths to the manifest files in the target repository.
      All listed files are updated within a single manifest PR, e.g. "west.yml,west-internal.yml"'

runs:
  using: "composite"
  steps:
    - name: Skip string detection
      id: check
      if: contains(github.event.pull_request.title, inputs.skip-string ) ||
        contains(github.event.pull_request.body, inputs.skip-string )
      shell: bash
      run: |
        echo "Skip string detected. Will skip following steps."
        echo "SKIP_STRING=true" >> "$GITHUB_OUTPUT"

    # fail in case of external user
    - name: Add external label
      uses: carlescufi/action-contribs@main
      with:
        github-token: ${{ inputs.token }}
        command: 'external'
        labels: 'external'

    - name: Stop in case external label is set
      shell: bash
      run: |
        LABELS=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name')

        if [[ "$LABELS" == *"external"* ]]; then
          AUTHOR_INFO=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json author --jq '.author')
          AUTHOR_LOGIN=$(echo "$AUTHOR_INFO" | jq -r '.login')
          AUTHOR_IS_BOT=$(echo "$AUTHOR_INFO" | jq -r '.is_bot')

          if [[ "$AUTHOR_LOGIN" == "app/github-actions" && "$AUTHOR_IS_BOT" == "true" ]]; then
            echo "Author is GitHub Actions bot, skipping external contribution check."
          else
            echo "External contribution detected. Automatic creation of manifest PR failed."
            echo "To test your changes, please create PR in the sdk-nrf repository."
            exit 1
          fi
        fi
      env:
        GH_TOKEN: ${{ inputs.token }}

    # Common setup for all the phases
    - name: Setup git
      if: ${{ steps.check.outputs.SKIP_STRING != 'true' }}
      shell: bash
      run: |
        git config --global user.email "pylon@nordicsemi.no"
        git config --global user.name "Nordic Builder"

    # Parse the comma separated manifest-file-path input once, so that all the
    # steps below can simply iterate over the resulting newline separated list.
    - name: Parse manifest file paths
      id: manifest_files
      if: ${{ steps.check.outputs.SKIP_STRING != 'true' }}
      shell: bash
      env:
        MANIFEST_FILE_PATHS: ${{ inputs.manifest-file-path }}
      run: |
        MANIFEST_FILES=$(tr ',' '\n' <<< "$MANIFEST_FILE_PATHS")
        echo "Manifest files to update:"
        echo "$MANIFEST_FILES"
        {
          echo "files<<MANIFEST_FILES_EOF"
          echo "$MANIFEST_FILES"
          echo "MANIFEST_FILES_EOF"
        } >> "$GITHUB_OUTPUT"

    # Checkout phase for manifest PR creation
    - name: Checkout sources
      if: ${{ github.event.action == 'opened' && steps.check.outputs.SKIP_STRING != 'true' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.target-repo }}
        token: ${{ inputs.token }}
        ref: ${{ inputs.base-branch }}


    # Manifest file preparation for manifest PR creation
    - name: Setup Python
      if: ${{ github.event.action == 'opened' && steps.check.outputs.SKIP_STRING != 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install manifest script dependencies
      if: ${{ github.event.action == 'opened' && steps.check.outputs.SKIP_STRING != 'true' }}
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "ruamel.yaml>=0.18.5"

    - name: Change manifest file revisions
      if: ${{ github.event.action == 'opened' && steps.check.outputs.SKIP_STRING != 'true' }}
      shell: bash
      env:
        COMMITS_URL: ${{ github.event.pull_request.commits_url }}
        MANIFEST_FILES: ${{ steps.manifest_files.outputs.files }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        REPO_NAME: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        LAST_MSG=""
        case "$PR_TITLE" in
          "Update MPSL and SoftDevice Controller"*|"Update revision of nrf_802154"*)
            if [ -n "$COMMITS_URL" ]; then
              # API URL details: https://docs.github.com/en/rest/pulls/pulls?apiVersion=2022-11-28#list-commits-on-a-pull-request
              LAST_MSG=$(curl -sS -H "Authorization: token $GH_TOKEN" "${COMMITS_URL}?per_page=3" | jq -r .[-1].commit.message)
            fi
            ;;
        esac
        while IFS= read -r MANIFEST_FILE; do
          echo "::group::Updating $MANIFEST_FILE"
          python "$GITHUB_ACTION_PATH/scripts/update_manifest.py" \
            --manifest-file "$MANIFEST_FILE" \
            --repo-name "$REPO_NAME" \
            --pr-number "$PR_NUMBER" \
            --pr-title "$PR_TITLE" \
            --commit-message "$LAST_MSG" < /dev/null
          echo "::endgroup::"
        done <<< "$MANIFEST_FILES"

    # create actual manifest PR
    - name: Commit changed manifest file and create PR
      if: ${{ github.event.action == 'opened' && steps.check.outputs.SKIP_STRING != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MANIFEST_PR_TITLE: ${{ inputs.manifest-pr-title-details }}
        MANIFEST_FILES: ${{ steps.manifest_files.outputs.files }}
        BODY: |
           Automatically created by action-manifest-pr GH action from PR:
           https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}

      run: |
        git checkout -b manifest_pr
        while IFS= read -r MANIFEST_FILE; do
          git add "$MANIFEST_FILE"
        done <<< "$MANIFEST_FILES"
        git commit -m "manifest: Update ${{ github.event.repository.name }} revision (auto-manifest PR)" -m "$BODY" --signoff
        git remote add fork "https://nordicbuilder:${{ inputs.token }}@github.com/${{ inputs.forked-repo }}"
        git push -u fork manifest_pr:auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
        USERNAME=$(echo "${{ inputs.forked-repo }}" | cut -d'/' -f1)
        gh pr create --head "$USERNAME:auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}" \
          --base ${{ inputs.base-branch }} --repo ${{ inputs.target-repo }} --title "manifest: ${{ github.event.repository.name }}: $MANIFEST_PR_TITLE" \
          --body "$BODY" ${{ inputs.draft-pr == 'true' && '--draft' || '' }}

    # Checkout phase for retrigger CI or update manifest file from PR to sha
    - name: Checkout sources from fork
      if: ${{ (github.event.action == 'synchronize' || github.event.pull_request.merged == true) && steps.check.outputs.SKIP_STRING != 'true' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.forked-repo }}
        token: ${{ inputs.token }}
        fetch-depth: 0

    # This is used for retriggering CI in case sub-PR got updates (assumes manifest PR exists)
    - name: Retrigger CI by changing commit sha and pushing
      if: ${{ github.event.action == 'synchronize' && steps.check.outputs.SKIP_STRING != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # If the source PR is merged while this run is in progress, this step's later force-push would
        # clobber the pinned merge commit back to pull/<N>/head. Bail out if the source PR is no longer
        # open so the SHA pin survives.
        # 
        # Note: Draft PRs return the state OPEN too. They are intentionally allowed to retrigger CI here.
        PR_STATE=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json state --jq '.state')
        if [[ "$PR_STATE" != "OPEN" ]]; then
          echo "Source PR is ${PR_STATE} (not open); skipping CI-retrigger force-push to avoid reverting the pinned merge commit."
          exit 0
        fi
        git checkout auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
        git remote add upstream https://github.com/${{ inputs.target-repo }}
        git fetch upstream
        git rebase upstream/${{ inputs.base-branch }} -X theirs
        git commit --amend --no-edit
        git push origin auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}:auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }} -f

    # This is used for changing PR pointer to sha in manifest file (assumes manifest PR exists)
    - name: Change commit sha and push it
      if: ${{ github.event.pull_request.merged == true && steps.check.outputs.SKIP_STRING != 'true' }}
      shell: bash
      env:
        MANIFEST_FILES: ${{ steps.manifest_files.outputs.files }}
      run: |
        git checkout auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
        git remote add upstream https://github.com/${{ inputs.target-repo }}
        git fetch upstream
        # Identify manifest commit
        MANIFEST_COMMIT=$(git log --format=%H --all-match -F \
          --grep='manifest: Update ${{ github.event.repository.name }} revision (auto-manifest PR)' \
          --grep='https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}' \
          upstream/${{ inputs.base-branch }}..HEAD)
        # Stop interactive rebase at manifest commit
        GIT_SEQUENCE_EDITOR="sed -i '0,/^pick /s//edit /'" GIT_EDITOR=true git rebase -i "$MANIFEST_COMMIT^"
        while IFS= read -r MANIFEST_FILE; do
          PROJECT_KEY=$(yq --exit-status '.manifest.projects[] | select(.repo-path == "${{ github.event.repository.name }}") |  key' "$MANIFEST_FILE")
          yq ".manifest.projects[$PROJECT_KEY].revision = \"${{ github.event.pull_request.merge_commit_sha }}\"" "$MANIFEST_FILE" > tmp.yml
          diff -B "$MANIFEST_FILE" tmp.yml | patch "$MANIFEST_FILE" - || true
          git add "$MANIFEST_FILE"
        done <<< "$MANIFEST_FILES"
        git commit --amend --no-edit
        GIT_EDITOR=true git rebase --continue
        set +e
        git merge-tree --write-tree --name-only upstream/${{ inputs.base-branch }} auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
        has_conflict="$?"
        echo "has_conflict is" $has_conflict
        set -e
        if (( $has_conflict == 1)) ; then git rebase upstream/${{ inputs.base-branch }} -X theirs ; fi
        git push origin auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}:auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }} -f

    - name: Close manifest-PR upon closing PR
      if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == false && steps.check.outputs.SKIP_STRING != 'true'}}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh pr close -R ${{ inputs.target-repo }} NordicBuilder:auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }} \
          --comment "Automatically closed by action-manifest-pr GH action" || true

    - name: Re-open  manifest-PR upon reopening PR
      if: ${{ github.event.action == 'reopened' && steps.check.outputs.SKIP_STRING != 'true'}}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh pr reopen -R ${{ inputs.target-repo }} NordicBuilder:auto-manifest-${{ github.event.repository.name }}-${{ github.event.pull_request.number }} \
          --comment "Automatically reopened by action-manifest-pr GH action" || true
